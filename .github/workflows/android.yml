name: Android
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'settings.gradle'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vault7-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify and build
        run: gradle --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Publish first release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk Vault7-v0.1.0.apk
          sha256sum Vault7-v0.1.0.apk > Vault7-v0.1.0.apk.sha256
          gh release create v0.1.0 Vault7-v0.1.0.apk Vault7-v0.1.0.apk.sha256 \
            --target "$GITHUB_SHA" --title "Vault7 0.1.0" --generate-notes
